name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VOICE_NORMAL_HOME: ${{ runner.temp }}\vn-home
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Sync environment
        run: uv sync

      # Шлях із кирилицею й пробілами — головний ризик для Windows-користувачів.
      - name: Wrappers from a Cyrillic path (pwsh)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'Тест папка з пробілами'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Set-Location $dir
          & "$env:GITHUB_WORKSPACE\voice-normal.cmd" doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $json = & "$env:GITHUB_WORKSPACE\voice-normal.ps1" doctor --json --lang ru | Out-String | ConvertFrom-Json
          if (-not $json.ok) { Write-Error $json.summary; exit 1 }

      # Моделі (~1.5 ГБ) кешуються; ключ змінюється разом із реєстром у models.py.
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\vn-home\models
          key: models-cpu-${{ hashFiles('src/voice_normal/models.py') }}

      - name: Install packages and models, smoke-test them
        shell: pwsh
        run: |
          $out = & "$env:GITHUB_WORKSPACE\voice-normal.ps1" install --device cpu --json --lang en | Out-String
          $result = $out | ConvertFrom-Json
          $result.smoke | Format-Table name, ok, seconds, detail -AutoSize -Wrap | Out-String -Width 200
          if (-not $result.ok) { Write-Error "install failed: $($result.error)"; exit 1 }
          $doctor = & "$env:GITHUB_WORKSPACE\voice-normal.ps1" doctor --json | Out-String | ConvertFrom-Json
          $models = $doctor.checks | Where-Object id -eq 'models'
          if ($models.status -ne 'ok') { Write-Error "doctor after install: $($models.message)"; exit 1 }

      # Після install доступні ML-пакети й моделі, тож ідуть і тести аналізу.
      - name: Unit tests
        run: uv run pytest -rs

      - name: plan on a recording in a Cyrillic path
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'Записи з камери'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Set-Location $dir
          ffmpeg -nostdin -v error -y -f lavfi -i "anoisesrc=color=pink:amplitude=0.05:duration=20:seed=1" "запис камера.wav"
          $plan = & "$env:GITHUB_WORKSPACE\voice-normal.ps1" plan "запис камера.wav" --out "результат\" --json | Out-String | ConvertFrom-Json
          if (-not $plan.ok) { Write-Error "plan failed: $($plan.error)"; exit 1 }
          if (-not (Test-Path "результат\запис камера.plan.md")) { Write-Error 'plan.md missing'; exit 1 }
          Get-Content "результат\запис камера.plan.md" -Encoding utf8

      # Windows PowerShell 5.1 — те, що стоїть у користувачів за замовчуванням.
      - name: PowerShell wrapper (Windows PowerShell 5.1)
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\voice-normal.ps1" doctor --lang en
          exit $LASTEXITCODE
